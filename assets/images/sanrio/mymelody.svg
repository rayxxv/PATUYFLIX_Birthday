<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- My Melody Pink Hood & Bunny Ears -->
  <path d="M 50 20 C 26 20, 16 38, 16 60 C 16 78, 30 90, 50 90 C 70 90, 84 78, 84 60 C 84 38, 74 20, 50 20 Z" fill="#f472b6"/>
  <!-- Left & Right Bunny Ears -->
  <ellipse cx="30" cy="18" rx="8" ry="20" fill="#f472b6" transform="rotate(-15 30 18)"/>
  <ellipse cx="70" cy="18" rx="8" ry="20" fill="#f472b6" transform="rotate(15 70 18)"/>
  <!-- White Face Oval -->
  <ellipse cx="50" cy="62" rx="26" ry="20" fill="#ffffff"/>
  <!-- Eyes -->
  <ellipse cx="38" cy="58" rx="2.5" ry="3.8" fill="#18181b"/>
  <ellipse cx="62" cy="58" rx="2.5" ry="3.8" fill="#18181b"/>
  <!-- Yellow Nose -->
  <ellipse cx="50" cy="62" rx="2.8" ry="2" fill="#facc15"/>
  <!-- Sweet Smile -->
  <path d="M 46 66 Q 50 69 54 66" stroke="#18181b" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- Flower on Right Ear -->
  <circle cx="68" cy="32" r="4" fill="#ffffff"/>
  <circle cx="68" cy="32" r="2" fill="#facc15"/>
  <!-- Cheeks -->
  <ellipse cx="32" cy="63" rx="3.5" ry="2" fill="#fb7185" opacity="0.6"/>
  <ellipse cx="68" cy="63" rx="3.5" ry="2" fill="#fb7185" opacity="0.6"/>
</svg>
