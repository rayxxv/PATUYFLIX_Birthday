  <ellipse cx="86" cy="52" rx="14" ry="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" transform="rotate(30 86 52)"/>
  <!-- Head & Body -->
  <ellipse cx="50" cy="52" rx="34" ry="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Blue Eyes -->
  <ellipse cx="36" cy="48" rx="4" ry="6" fill="#3b82f6"/>
  <ellipse cx="64" cy="48" rx="4" ry="6" fill="#3b82f6"/>
  <!-- Cute Pink Cheeks -->
  <ellipse cx="26" cy="54" rx="5" ry="3" fill="#f472b6" opacity="0.7"/>
  <ellipse cx="74" cy="54" rx="5" ry="3" fill="#f472b6" opacity="0.7"/>
  <!-- W-shaped Mouth -->
  <path d="M 45 53 Q 48 56 50 53 Q 52 56 55 53" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Curly Tail -->
  <path d="M 50 72 C 40 76, 35 70, 42 66 C 45 64, 48 68, 45 70" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
