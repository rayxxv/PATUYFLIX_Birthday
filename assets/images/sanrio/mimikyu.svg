<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Wooden Lightning Tail -->
  <path d="M 18 82 L 10 70 L 16 68 L 8 54 L 20 60 L 14 74 Z" fill="#92400e" stroke="#78350f" stroke-width="1.2"/>
  
  <!-- Disguise Body & Base Frills -->
  <path d="M 32 45 C 28 55 24 72 26 84 C 30 88 36 80 40 85 C 45 90 50 82 55 86 C 60 90 66 82 70 86 C 74 90 78 80 80 82 C 78 70 76 55 72 45 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  
  <!-- Disguise Head -->
  <ellipse cx="52" cy="42" rx="24" ry="22" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  
  <!-- Left Ear (Pointing Up-Left with Droopy Tip) -->
  <path d="M 38 28 C 34 16 28 8 24 6 C 22 8 24 16 28 22 C 30 26 34 28 38 28 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <path d="M 27 12 C 25 8 24 6 24 6 C 22 8 24 14 26 15 Z" fill="#451a03"/>
  
  <!-- Right Ear (Bent/Floppy Ear) -->
  <path d="M 64 26 C 68 18 76 14 84 18 C 86 24 80 28 72 28 C 68 28 66 27 64 26 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <path d="M 76 16 C 80 15 84 18 84 18 C 84 21 80 24 76 22 Z" fill="#451a03"/>
  
  <!-- Hand-drawn Scribble Eyes on Disguise Head -->
  <ellipse cx="44" cy="40" rx="3.5" ry="4" fill="#292524" transform="rotate(-6 44 40)"/>
  <ellipse cx="62" cy="40" rx="3.5" ry="4" fill="#292524" transform="rotate(6 62 40)"/>
  
  <!-- Scribbled Cheeks (Blush) -->
  <circle cx="37" cy="47" r="4.5" fill="#f87171" opacity="0.8"/>
  <circle cx="69" cy="47" r="4.5" fill="#f87171" opacity="0.8"/>
  
  <!-- Jagged Scribbled Smile -->
  <path d="M 44 48 Q 47 52 50 49 Q 53 53 56 49 Q 60 52 62 48" stroke="#292524" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- True Eyes Peeking from Lower Body Slit -->
  <ellipse cx="46" cy="68" rx="2.5" ry="1.2" fill="#0c0a09"/>
  <circle cx="46" cy="67.7" r="0.6" fill="#ffffff"/>
  <ellipse cx="58" cy="68" rx="2.5" ry="1.2" fill="#0c0a09"/>
  <circle cx="58" cy="67.7" r="0.6" fill="#ffffff"/>
</svg>
