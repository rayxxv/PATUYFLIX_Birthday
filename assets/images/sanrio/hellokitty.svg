  <line x1="16" y1="52" x2="28" y2="53" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="14" y1="58" x2="27" y2="58" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="64" x2="28" y2="63" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="84" y1="52" x2="72" y2="53" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="86" y1="58" x2="73" y2="58" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="84" y1="64" x2="72" y2="63" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
</svg>
