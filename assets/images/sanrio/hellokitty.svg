<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Hello Kitty Head -->
  <ellipse cx="50" cy="55" rx="36" ry="28" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
