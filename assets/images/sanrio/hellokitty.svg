  <path d="M 22 36 L 16 18 L 34 26 Z" fill="#ffffff" stroke="#18181b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 78 36 L 84 18 L 66 26 Z" fill="#ffffff" stroke="#18181b" stroke-width="2" stroke-linejoin="round"/>
  <!-- Red Bow on Left Ear -->
  <circle cx="28" cy="26" r="5" fill="#ef4444" stroke="#18181b" stroke-width="1.5"/>
  <path d="M 28 26 C 20 18, 14 30, 28 26" fill="#ef4444" stroke="#18181b" stroke-width="1.5"/>
  <path d="M 28 26 C 36 18, 42 30, 28 26" fill="#ef4444" stroke="#18181b" stroke-width="1.5"/>
  <!-- Eyes -->
  <ellipse cx="36" cy="54" rx="3" ry="4" fill="#18181b"/>
  <ellipse cx="64" cy="54" rx="3" ry="4" fill="#18181b"/>
  <!-- Yellow Nose -->
  <ellipse cx="50" cy="60" rx="3.5" ry="2.5" fill="#facc15" stroke="#18181b" stroke-width="1.2"/>
